name: deploy
on:
  push:
    branches: ["main"]
permissions: {}
# 서버 배포 스크립트는 flock 으로 한 번에 하나만 돌고, 이미 돌고 있으면 바로 실패한다.
# 그래서 배포를 여기서 한 번에 하나씩 돌린다. 대기 중인 실행은 가장 최근 것 하나만 남고,
# 그 실행이 main 의 최신 커밋을 배포하므로 연달아 머지해도 마지막 머지까지 반영된다.
# 진행 중인 배포는 끊지 않는다(cancel-in-progress: false).
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: execute remote ssh & deploy frontend server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          # 서버 authorized_keys 의 forced-command 가 /usr/local/bin/deploy-montessoris 를 실행한다.
          # 아래 script 는 서버에서 무시되고 $SSH_ORIGINAL_COMMAND 로 로깅만 된다(최소 유지).
          script: |
            echo "deploy: montessoris-web -> server forced-command (deploy-montessoris)"
